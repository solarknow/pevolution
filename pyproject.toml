[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pevolution"
version = "1.1"
description = "A pipeline to find, align, and find trees for putatively related proteins."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Mihir Sarwade", email = "mihir.sarwade@gmail.com"}
]
license = "MIT"
keywords = ["bioinformatics", "protein", "evolution", "phylogenetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.85",
    "requests>=2.31.0",
    "certifi>=2024.7.4",
    "urllib3>=2.0.0",
    "psutil>=5.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/solarknow/pevolution"
Documentation = "https://github.com/solarknow/pevolution#readme"
Repository = "https://github.com/solarknow/pevolution.git"
Issues = "https://github.com/solarknow/pevolution/issues"

[tool.setuptools]
packages = ["Utils", "helpers"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "venv1",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []

[tool.isort]
profile = "black"
line_length = 120

